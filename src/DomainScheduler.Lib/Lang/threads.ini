; Built-in system presets (section 14). Applied by the sys layer, independently of Auto.
;
; [SETTINGS]      sleep=<ms>   default re-apply interval (ReapplyMs)
; [DISABLEBOOST]  process names without .exe: dynamic priority boost off (Preset.Boost = "off")
; [<process>]     module=<pattern>,<prio>[,tid=<first|last|N>][,disableboost]
;                 description=<pattern>,<prio>[,tid=<first|last|N>][,disableboost]
;   prio: -15, -2, -1, 0, 1, 2, 15 (Windows thread priority; 15 is parsed but never applied)

[SETTINGS]
sleep=10000

[DISABLEBOOST]
spotify
discord
steam
steamwebhelper
searchapp
dllhost
ayugram

[spotify]
module=libcef.dll,-1
module=chrome_elf.dll,-1

[discord]
module=discord_voice.node,1
description=*Compositor*,-1
description=ThreadPoolForegroundWorker,-1

[steam]
module=steamui.dll,-1
module=steamclient64.dll,-1

[steamwebhelper]
module=libcef.dll,-2
description=*Compositor*,-2

[dwm]
module=dwmcore.dll,1
description=DWM Master Input Thread,2

[searchapp]
module=SearchApp.exe,-2

[winlogon]
module=winlogon.exe,-1

[audiodg]
module=AudioEng.dll,2
module=audiodg.exe,1

[sihost]
module=sihost.exe,-1

[taskhostw]
module=taskhostw.exe,-1

[dllhost]
module=dllhost.exe,-1

[startmenuexperiencehost]
module=StartMenuExperienceHost.exe,-1

[shellexperiencehost]
module=ShellExperienceHost.exe,-1

[textinputhost]
module=TextInputHost.exe,-1

[conhost]
module=conhost.exe,-1

[explorer]
module=explorerframe.dll,-1
module=thumbcache.dll,-2

[ctfmon]
module=msctf.dll,1

[ayugram]
module=AyuGram.exe,-1

[winws]
module=winws.exe,1
module=WinDivert.dll,1

[domainscheduler]
module=DomainScheduler.exe,-1
